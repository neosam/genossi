[package]
name = "genossi_mail"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true

[dependencies]
genossi_config = { path = "../genossi_config" }
genossi_dao = { path = "../genossi_dao" }
genossi_service = { path = "../genossi_service", features = ["utoipa"] }
async-trait = { workspace = true }
mockall = { workspace = true }
sqlx = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
uuid = { workspace = true }
# `local-offset`: Digest-Worker liest die Server-Lokalzeit (TZ env) via
# OffsetDateTime::now_local() für is_due (Phase 20, D-02). Vereinigt sich mit
# den Workspace-Features (serde/formatting/parsing).
time = { workspace = true, features = ["local-offset"] }
axum = { workspace = true }
utoipa = { workspace = true }
lettre = { workspace = true }
minijinja = "2"
sha2 = "0.10"
async-imap = { version = "0.10", default-features = false, features = ["runtime-tokio"] }
tokio-rustls = "0.26"
rustls = { version = "0.23", default-features = false, features = ["ring"] }
webpki-roots = "0.26"
mail-parser = "0.9"
futures = "0.3"

[lints]
workspace = true
